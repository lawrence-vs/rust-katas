syntax = "proto3";
package catalogue;

service Catalogue {
  rpc GetItem (GetItemRequest) returns (Item);
  rpc SetPrice (SetPriceRequest) returns (Item);
}

message GetItemRequest {
  string sku = 1;
  string currency = 2;
}

message SetPriceRequest {
  string sku = 1;
  uint64 price_cents = 2;
}

message Item {
  string sku = 1;
  string tenant = 2;
  string currency = 3;
  uint64 price_cents = 4;
}
